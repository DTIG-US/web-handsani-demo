<section class="demo-section" aria-label="Hand Sanitation Demo">
  <div class="demo-wrapper">
    <div class="content-wrapper">
      @if (isProcessing()) {
        <div class="loading-state" aria-live="polite" aria-busy="true">
          <div class="spinner" aria-hidden="true"></div>
          <p>Analyzing video frames…</p>
          <div class="progress-bar" role="progressbar" [attr.aria-valuenow]="uploadProgress()" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-fill" [style.width.%]="uploadProgress()"></div>
          </div>
        </div>
      } @else if (result()) {
        <app-results [result]="result()!" (reset)="reset()" />
      } @else {
        <app-upload (fileDropped)="onFileSelected($event)" />
      }
    </div>
  </div>
</section>
